<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIppt · AI 演示文稿</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= Header ================= -->
  <header class="sf-header" role="banner">
    <a class="sf-brand" href="#top" aria-label="AIppt home">
      <img src="assets/logo.png" alt="AIppt logo" width="44" height="44">
      <span>
        <span class="sf-brand-name">AIppt</span>
        <span class="sf-brand-tag">AI 演示文稿生成 · Powered by SlideForge (MIT)</span>
      </span>
    </a>
  </header>

  <!-- ================= Home view ================= -->
  <main id="sf-home">
    <section class="sf-hero" id="top" aria-label="Introduction">
      <h1>输入主题，AI 生成<span>可编辑</span>的演示文稿</h1>
      <p class="sf-lead">由 Anna 平台 AI 驱动：生成多页幻灯片，逐页预览、在线修改，一键导出可在 PowerPoint / WPS 中继续编辑的 PPTX。</p>
    </section>

    <section class="sf-form-card" aria-label="Deck generator">
      <h2>创建你的演示文稿</h2>
      <form id="sf-form" class="sf-form-row">
        <input class="sf-input sf-topic" id="sf-topic" type="text"
               placeholder="PPT 主题，例如：人工智能在教育领域的应用"
               required aria-label="PPT 主题">
        <input class="sf-input" id="sf-count" type="number" min="3" max="20" value="5"
               placeholder="页数" title="PPT 页数，例如：8 页" aria-label="PPT 页数，例如 8 页"
               style="max-width:90px;">
        <input class="sf-input" id="sf-audience" type="text"
               placeholder="目标受众，例如：大学生、企业管理者"
               aria-label="目标受众">
        <select class="sf-select" id="sf-tone" aria-label="演讲语气，例如：专业、简洁、轻松"
                title="演讲语气，例如：专业、简洁、轻松">
          <option value="professional">语气：专业</option>
          <option value="casual">语气：轻松</option>
          <option value="academic">语气：学术</option>
          <option value="persuasive">语气：说服</option>
          <option value="educational">语气：科普</option>
        </select>
        <textarea class="sf-input sf-extra" id="sf-extra" rows="3"
          placeholder="补充说明（可选）：请输入对 PPT 的补充要求，例如重点介绍哪些内容、希望采用什么风格、是否需要案例或总结等……"
          aria-label="补充说明"></textarea>
        <button class="sf-btn sf-btn-primary" id="sf-generate-btn" type="submit">生成大纲 &#9889;</button>
      </form>
      <div class="sf-chips" aria-label="Example topics">
        <button class="sf-example" type="button" data-topic="人工智能在教育中的应用">试试：AI 教育</button>
        <button class="sf-example" type="button" data-topic="远程办公的最佳实践">试试：远程办公</button>
        <button class="sf-example" type="button" data-topic="量子计算入门">试试：量子计算</button>
        <button class="sf-example" type="button" data-topic="新员工入职培训">试试：入职培训</button>
      </div>
      <div class="sf-status" id="sf-status" role="status" aria-live="polite"></div>
    </section>

    <section class="sf-recent" id="sf-saved" aria-label="Recent decks"></section>
  </main>


  <!-- ================= Outline editor view ================= -->
  <section class="sf-outline-shell" id="sf-outline" aria-label="Outline editor">
    <div class="sf-outline-head">
      <h2>大纲编辑</h2>
      <span class="sf-outline-meta" id="sf-outline-meta"></span>
    </div>
    <div class="sf-outline-list" id="sf-outline-list"></div>
    <div class="sf-outline-actions">
      <textarea class="sf-input" id="sf-outline-feedback" rows="3"
        placeholder="补充修改要求（可选），例如：第三页增加实际案例，删除第四页，最后一页重点介绍未来发展趋势……"
        aria-label="补充修改要求"></textarea>
      <div class="sf-outline-btns">
        <button class="sf-btn sf-btn-ghost" id="sf-outline-back" type="button">返回输入</button>
        <button class="sf-btn sf-btn-primary" id="sf-outline-update" type="button">更新大纲</button>
        <button class="sf-btn sf-btn-primary" id="sf-outline-confirm" type="button">确认大纲，生成 PPT</button>
      </div>
    </div>
  </section>

  <!-- ================= Editor view ================= -->
  <section class="sf-editor-shell" id="sf-editor" aria-label="Presentation editor">
    <div class="sf-stage-wrap">
      <div class="sf-stage" id="sf-stage" role="region" aria-label="Current slide"></div>
      <div class="sf-toolbar" id="sf-toolbar" role="toolbar" aria-label="Slide controls"></div>
    </div>
  </section>

  <!-- ================= Footer ================= -->
  <footer class="sf-footer" role="contentinfo">
    <span>AIppt · UI based on <a href="https://github.com/vincenzo-afk/SlideForge" target="_blank" rel="noopener">SlideForge</a> &middot; MIT License &middot; AI by Anna Platform</span>
  </footer>

  <!-- ===== Scripts (order matters, no bundler) ===== -->
  <script src="js/config.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/slides.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/export.js"></script>
  <script src="js/outline.js"></script>
  <script src="js/app.js"></script>
  <script src="js/anna-adapter.js"></script>
</body>
</html>
