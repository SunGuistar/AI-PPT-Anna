# Build the focus-flow Executa as multi-platform binary distribution archives
# and publish them to a GitHub Release, following the official Anna tutorial:
# https://forum.anna.partners/t/dont-just-run-locally-a-hands-on-guide-to-packaging-anna-executa-as-a-releasable-binary/140
#
# Tag convention: focus-flow-v<version> (read from executas/focus-flow/executa.json).
# Asset names: <tool_id>-<platform>.tar.gz (+ .sha256), consumed by the Anna
# platform's Binary distribution (binary_urls).
name: build-focus-flow-binary

on:
  workflow_dispatch:
  push:
    tags:
      - "focus-flow-v*"

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tool_id: ${{ steps.read.outputs.tool_id }}
      version: ${{ steps.read.outputs.version }}
      slug: ${{ steps.read.outputs.slug }}
      tag: ${{ steps.read.outputs.tag }}
      executa_dir: ${{ steps.read.outputs.executa_dir }}
    steps:
      - uses: actions/checkout@v4
      - name: Read publish metadata from executa.json
        id: read
        working-directory: executas/focus-flow
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("executa.json", encoding="utf-8") as f:
              data = json.load(f)
          tool_id = data["tool_id"]
          version = data.get("version") or "0.0.0"
          slug = data.get("slug") or "focus-flow"
          tag = f"{slug}-v{version}"
          print(f"tool_id={tool_id}")
          print(f"version={version}")
          print(f"slug={slug}")
          print(f"tag={tag}")
          print("executa_dir=executas/focus-flow")
          PY

  build:
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
          - platform: darwin-x86_64
            os: macos-15-intel
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: windows-x86_64
            os: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The onefile binary must stay under the platform's ~20 MiB download
      # ceiling. setup-python (and uv) ship python-build-standalone builds
      # whose statically-linked libpython inflates the Linux binary to
      # ~33 MB. Build inside python:3.12-slim (Debian system python, dynamic
      # libpython) instead — byte-for-byte the environment the package was
      # locally verified in.
      - name: Build binary archive (Linux, in Docker)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ needs.meta.outputs.executa_dir }}
        env:
          TOOL_ID: ${{ needs.meta.outputs.tool_id }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          chmod +x package_binary.sh
          docker run --rm -v "$PWD:/src" -w /src python:3.12-slim \
            bash -c "apt-get update -qq && apt-get install -y -qq binutils >/dev/null && pip install -q pyinstaller python-pptx && ./package_binary.sh"
          test -f "dist-anna/$TOOL_ID-$PLATFORM.tar.gz"
      - name: Prepare build dependencies (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          pip install pyinstaller python-pptx
          echo "PYINSTALLER_PYTHON=python" >> "$GITHUB_ENV"
      - name: Build binary archive (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        working-directory: ${{ needs.meta.outputs.executa_dir }}
        env:
          TOOL_ID: ${{ needs.meta.outputs.tool_id }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          chmod +x package_binary.sh
          ./package_binary.sh
          test -f "dist-anna/$TOOL_ID-$PLATFORM.tar.gz"
      - name: JSON-RPC smoke test (describe over stdio)
        working-directory: ${{ needs.meta.outputs.executa_dir }}
        env:
          TOOL_ID: ${{ needs.meta.outputs.tool_id }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          bin="dist-anna/staging-$PLATFORM/bin/$TOOL_ID"
          if [ "$PLATFORM" = "windows-x86_64" ]; then bin="$bin.exe"; fi
          test -x "$bin" || test -f "$bin"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"describe"}' | "$bin" | grep -q '"export_pptx"'
      - name: Write sha256 file
        working-directory: ${{ needs.meta.outputs.executa_dir }}
        env:
          TOOL_ID: ${{ needs.meta.outputs.tool_id }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          archive="dist-anna/$TOOL_ID-$PLATFORM.tar.gz"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.tool_id }}-${{ matrix.platform }}
          path: |
            ${{ needs.meta.outputs.executa_dir }}/dist-anna/${{ needs.meta.outputs.tool_id }}-${{ matrix.platform }}.tar.gz
            ${{ needs.meta.outputs.executa_dir }}/dist-anna/${{ needs.meta.outputs.tool_id }}-${{ matrix.platform }}.tar.gz.sha256

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: find release-assets -maxdepth 1 -type f -print | sort
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: focus-flow v${{ needs.meta.outputs.version }}
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*
