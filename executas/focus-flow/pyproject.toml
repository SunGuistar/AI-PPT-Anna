[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-focus-flow"
version = "0.1.0"
description = "Executa for the focus-flow Anna App"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.2",
]

[project.scripts]
"tool-dev-focus-flow" = "focus_flow_plugin:main"

[tool.setuptools]
py-modules = ["focus_flow_plugin"]
